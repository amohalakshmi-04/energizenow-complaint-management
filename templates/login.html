{% extends "base.html" %}

{% block title %}Login | EnergizeNow{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            ⚡
        </div>

        <h2>Welcome Back</h2>

        <p>
            Sign in to your EnergizeNow account
        </p>


        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input type="email"
                       name="email"
                       class="form-control form-control-lg"
                       placeholder="Enter your email"
                       required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control form-control-lg"
                       placeholder="Enter your password"
                       required>

            </div>


            <button type="submit"
                    class="btn btn-primary btn-lg w-100">
                Sign In →
            </button>

        </form>


        <div class="login-footer">
            EnergizeNow Complaint & Service Management
        </div>

    </div>

</div>

{% endblock %}
