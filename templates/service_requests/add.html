{% extends "base.html" %}

{% block title %}Add Service Request | EnergizeNow{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="form-page-header">

        <span class="page-label">NEW RECORD</span>

        <h1>
            Create Service Request
        </h1>

        <p>
            Enter the service request details below.
        </p>

    </div>


    <div class="form-card">

        <form method="POST">

            <div class="mb-4">

                <label class="form-label">
                    Request Title
                </label>

                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="Enter request title"
                       required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Description
                </label>

                <textarea name="description"
                          class="form-control"
                          rows="5"
                          placeholder="Describe the service request..."
                          required></textarea>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Priority
                </label>

                <select name="priority"
                        class="form-select">

                    <option value="Low">
                        Low
                    </option>

                    <option value="Medium" selected>
                        Medium
                    </option>

                    <option value="High">
                        High
                    </option>

                </select>

            </div>


            <div class="form-actions">

                <a
    href="{{ url_for('service_requests.customer_service_requests') }}"
    class="btn btn-secondary"
>
    Cancel
</a>

                <button type="submit"
                        class="btn btn-primary">
                    Create Request
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
